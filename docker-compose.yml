# Despliegue local de Trend Radar. Uso: cp .env.example .env && docker compose up -d --build
# Aplicación: http://localhost:5180   ·   API directa: http://localhost:8080

name: trend-radar

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trendradar
      POSTGRES_USER: trendradar_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?Define DB_OWNER_PASSWORD en .env}
      TRENDRADAR_APP_PASSWORD: ${DB_APP_PASSWORD:?Define DB_APP_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trendradar_owner -d trendradar']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TrendRadar: Host=db;Database=trendradar;Username=trendradar_app;Password=${DB_APP_PASSWORD}
      ConnectionStrings__TrendRadarMigrations: Host=db;Database=trendradar;Username=trendradar_owner;Password=${DB_OWNER_PASSWORD}
      Database__MigrateOnStartup: 'true'
      Auth__JwtSecret: ${JWT_SECRET:?Define JWT_SECRET en .env (32+ caracteres)}
      # Local por HTTP: la cookie no puede ser Secure fuera de localhost.
      Auth__SecureCookies: 'false'
      Bootstrap__OwnerEmail: ${OWNER_EMAIL:-}
      Bootstrap__OwnerName: ${OWNER_NAME:-Jaime Gallo}
      Bootstrap__OwnerPassword: ${OWNER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - '5180:80'

volumes:
  pgdata:
