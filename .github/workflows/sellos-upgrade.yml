name: Completar sellos

# OpenTimestamps entrega primero un sello pendiente; el anclaje en Bitcoin
# se completa horas después. Este workflow incorpora esos anclajes a los .ots.
# El cron solo se ejecuta en la rama por defecto.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente OpenTimestamps
        run: pip install --quiet opentimestamps-client

      - name: Completar sellos pendientes
        run: |
          for f in signals/*.ots; do
            [ -e "$f" ] || continue
            ots upgrade "$f" || echo "Aún pendiente: $f"
          done
          rm -f signals/*.ots.bak

      - name: Guardar sellos
        run: |
          git add signals/*.ots 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Completar sellos OpenTimestamps (anclaje en Bitcoin)"
          git push
