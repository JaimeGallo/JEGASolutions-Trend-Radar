name: Señales

on:
  push:
    paths:
      - "signals/**"
      - "scripts/validar_senales.py"
  pull_request:
    paths:
      - "signals/**"

permissions:
  contents: write

concurrency:
  group: senales-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar formato e inmutabilidad
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE:-$BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # Rama nueva: comparar contra la rama por defecto
            git fetch -q origin "${{ github.event.repository.default_branch }}"
            base="$(git merge-base HEAD FETCH_HEAD)"
          fi
          python3 scripts/validar_senales.py "$base"

  sellar:
    needs: validar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente OpenTimestamps
        run: pip install --quiet opentimestamps-client

      - name: Sellar señales sin sello
        run: |
          sellados=0
          for f in signals/TR-*.md; do
            [ -f "$f.ots" ] && continue
            for intento in 1 2 3; do
              if ots stamp "$f"; then sellados=$((sellados + 1)); break; fi
              sleep $((intento * 10))
            done
          done
          echo "Señales selladas: $sellados"

      - name: Guardar sellos
        run: |
          git add signals/*.ots 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin sellos nuevos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sellos OpenTimestamps de señales nuevas"
          git push
